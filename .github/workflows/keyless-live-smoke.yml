name: Keyless public-data smoke
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/keyless-live-smoke.yml'
      - 'scripts/keyless_smoke.py'
      - 'docs/NO_KEY_DATA.md'
  pull_request:
    paths:
      - '.github/workflows/keyless-live-smoke.yml'
      - 'scripts/keyless_smoke.py'
      - 'docs/NO_KEY_DATA.md'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Public API smoke test (no API keys or secrets)
        run: python -m scripts.keyless_smoke
      - name: Run Rosie scanner CLI with no keys
        run: |
          python market_scan.py scan --limit 100
          python -c "import json; d=json.load(open('rosie_scan.json')); print('Contracts scanned:', d['market_count']); print('Provider errors:', d['platform_errors']); assert d['market_count'] >= 100, 'Live discovery returned too few markets'"
      - name: Upload sanitized smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyless-smoke-report
          path: keyless_smoke.json
          if-no-files-found: ignore
