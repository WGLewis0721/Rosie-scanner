name: Keyless public-data smoke
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/keyless-live-smoke.yml'
      - 'scripts/keyless_smoke.py'
      - 'docs/NO_KEY_DATA.md'
  pull_request:
    paths:
      - '.github/workflows/keyless-live-smoke.yml'
      - 'scripts/keyless_smoke.py'
      - 'docs/NO_KEY_DATA.md'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Public API smoke test (no API keys or secrets)
        run: python scripts/keyless_smoke.py
      - name: Upload sanitized smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyless-smoke-report
          path: keyless_smoke.json
          if-no-files-found: ignore
